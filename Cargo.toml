[package]
name = "aio-idea"
version = "2026.9.11"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.99"
axum = { version = "0.8.6", optional = true }
dill = "0.15.0"
dioxus = { version = "=0.7.9", default-features = false, features = ["macro", "html", "signals"], optional = true }
az-dioxus-admin-shell = { git = "https://github.com/zjarlin/dioxus-admin-workbench.git", rev = "819ae159ab7dcba65d33d056d528ae8f7ec32ae2", default-features = false, optional = true }
az-ui-components = { git = "https://github.com/zjarlin/dioxus-admin-workbench.git", rev = "819ae159ab7dcba65d33d056d528ae8f7ec32ae2", optional = true }
az-plugin-manifest = { git = "https://github.com/zjarlin/aio-platform.git", rev = "945f36465ff604defcdc051ac005a9c1a4261714", default-features = false }
az-plugin-package = { git = "https://github.com/zjarlin/aio-platform.git", rev = "945f36465ff604defcdc051ac005a9c1a4261714", optional = true }
gloo-net = { version = "0.6.0", features = ["http", "json"], optional = true }
flate2 = { version = "1.1.2", optional = true }
kuchikiki = { version = "=0.8.8-speedreader", optional = true }
mime_guess = { version = "2.0.5", optional = true }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = { version = "0.10.9", optional = true }
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls", "json"], optional = true }
tar = { version = "0.4.44", optional = true }
tokio = { version = "1.47.1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "sync", "time"], optional = true }
toml = { version = "0.9.5", optional = true }
tower-http = { version = "0.6.2", features = ["fs"], optional = true }
uuid = { version = "1.18.1", features = ["v4", "v5"], optional = true }
wasmtime = { version = "48.0.0", default-features = false, features = ["anyhow", "component-model", "cranelift", "gc-drc", "runtime", "std"], optional = true }
web-sys = { version = "0.3.77", features = ["Location", "Window"], optional = true }
aio_plugin_account = { package = "aio-plugin-account", git = "https://github.com/zjarlin/aio-plugin-account.git", rev = "b6e6c561397e60fba1a1a9832ded783b19969506", optional = true }
aio_plugin_dictionary_client = { package = "aio-plugin-dictionary-client", git = "https://github.com/zjarlin/aio-plugin-dictionary.git", rev = "6a3ec1bfa8278c32d9d3f76e003138061d567a41", optional = true }
aio_plugin_dictionary_server = { package = "aio-plugin-dictionary-server", git = "https://github.com/zjarlin/aio-plugin-dictionary.git", rev = "6a3ec1bfa8278c32d9d3f76e003138061d567a41", optional = true }
aio_plugin_file_client = { package = "aio-plugin-file-client", git = "https://github.com/zjarlin/aio-plugin-file.git", rev = "c5848bfc076f2bdaa9362aa317419c27cc6fbf24", optional = true }
aio_plugin_file_server = { package = "aio-plugin-file-server", git = "https://github.com/zjarlin/aio-plugin-file.git", rev = "c5848bfc076f2bdaa9362aa317419c27cc6fbf24", optional = true }
aio_plugin_marketplace_client = { package = "aio-plugin-marketplace-client", git = "https://github.com/zjarlin/aio-plugin-marketplace.git", rev = "1a1db32849e4369f4765c0495ef2d571ebf77eee", optional = true }
aio_plugin_marketplace_server = { package = "aio-plugin-marketplace-server", git = "https://github.com/zjarlin/aio-plugin-marketplace.git", rev = "1a1db32849e4369f4765c0495ef2d571ebf77eee", optional = true }
aio_plugin_settings = { package = "aio-plugin-settings", git = "https://github.com/zjarlin/aio-plugin-settings.git", rev = "dc0cd5c48c4f38288feb3c32279f94f0b055044f", optional = true }
aio_plugin_identity_client = { package = "aio-plugin-identity-client", git = "https://github.com/zjarlin/aio-plugin-identity.git", rev = "e04457b7b1ebb0334f39351fbffb40fafcca81b1", optional = true }
aio_plugin_identity_server = { package = "aio-plugin-identity-server", git = "https://github.com/zjarlin/aio-plugin-identity.git", rev = "e04457b7b1ebb0334f39351fbffb40fafcca81b1", optional = true }
aio_plugin_rbac_client = { package = "aio-plugin-rbac-client", git = "https://github.com/zjarlin/aio-plugin-rbac.git", rev = "9071afad6df9ee6517e05e30dcc67fbfde11795a", optional = true }
aio_plugin_rbac_server = { package = "aio-plugin-rbac-server", git = "https://github.com/zjarlin/aio-plugin-rbac.git", rev = "9071afad6df9ee6517e05e30dcc67fbfde11795a", optional = true }
aio_plugin_tenant_client = { package = "aio-plugin-tenant-client", git = "https://github.com/zjarlin/aio-plugin-tenant.git", rev = "40b8480acfc34ea913264422e685b49044b701ec", optional = true }
aio_plugin_tenant_server = { package = "aio-plugin-tenant-server", git = "https://github.com/zjarlin/aio-plugin-tenant.git", rev = "40b8480acfc34ea913264422e685b49044b701ec", optional = true }

[features]
default = ["web"]
ui = ["dep:dioxus", "dep:az-dioxus-admin-shell", "dep:az-ui-components"]
web = ["ui", "dioxus/web", "dioxus/launch", "dep:gloo-net", "dep:web-sys", "dep:aio_plugin_account", "dep:aio_plugin_dictionary_client", "dep:aio_plugin_file_client", "dep:aio_plugin_identity_client", "dep:aio_plugin_marketplace_client", "dep:aio_plugin_rbac_client", "dep:aio_plugin_settings", "dep:aio_plugin_tenant_client"]
desktop = ["ui", "dioxus/desktop", "dioxus/launch", "dep:gloo-net", "dep:web-sys", "dep:aio_plugin_account", "dep:aio_plugin_dictionary_client", "dep:aio_plugin_file_client", "dep:aio_plugin_identity_client", "dep:aio_plugin_marketplace_client", "dep:aio_plugin_rbac_client", "dep:aio_plugin_settings", "dep:aio_plugin_tenant_client"]
server = ["az-plugin-manifest/validation", "dep:az-plugin-package", "dep:axum", "dep:flate2", "dep:kuchikiki", "dep:mime_guess", "dep:reqwest", "dep:sha2", "dep:sqlx", "dep:tar", "dep:tokio", "dep:toml", "dep:tower-http", "dep:uuid", "dep:wasmtime", "dep:aio_plugin_dictionary_server", "dep:aio_plugin_file_server", "dep:aio_plugin_identity_server", "dep:aio_plugin_marketplace_server", "dep:aio_plugin_rbac_server", "dep:aio_plugin_tenant_server"]

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
base64 = "0.22.1"
tempfile = "3.23.0"

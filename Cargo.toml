[package]
name = "aio-idea"
version = "2026.9.11"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
az-plugin-delivery = { git = "https://github.com/zjarlin/aio-platform.git", rev = "2e03cb9c34bbe357d3a1e9e3cb5789beef310748" }
base64 = "0.22.1"
anyhow = "1.0.99"
async-trait = { version = "0.1", optional = true }
futures-util = { version = "0.3", optional = true }
az-plugin-bundle = { git = "https://github.com/zjarlin/aio-platform.git", rev = "6844ab72d26058c154fe6489b560477b1baf50b1", optional = true }
az-plugin-contract = { git = "https://github.com/zjarlin/aio-platform.git", rev = "6844ab72d26058c154fe6489b560477b1baf50b1", optional = true }
az-plugin-runtime = { git = "https://github.com/zjarlin/aio-platform.git", rev = "6844ab72d26058c154fe6489b560477b1baf50b1", optional = true }
semver = { version = "1", optional = true }
getrandom = { version = "0.4.2", optional = true }
axum = { version = "0.8.6", optional = true }
dill = "0.15.0"
dioxus = { version = "=0.7.9", default-features = false, features = ["macro", "html", "signals"], optional = true }
az-dioxus-admin-shell = { git = "https://github.com/zjarlin/dioxus-admin-workbench.git", rev = "22ee3cb9324f90e1833080d01663b92c28929c75", default-features = false, optional = true }
az-ui-components = { git = "https://github.com/zjarlin/dioxus-admin-workbench.git", rev = "22ee3cb9324f90e1833080d01663b92c28929c75", optional = true }
az-plugin-manifest = { git = "https://github.com/zjarlin/aio-platform.git", rev = "2e03cb9c34bbe357d3a1e9e3cb5789beef310748", default-features = false }
az-plugin-package = { git = "https://github.com/zjarlin/aio-platform.git", rev = "2e03cb9c34bbe357d3a1e9e3cb5789beef310748", optional = true }
gloo-net = { version = "0.6.0", features = ["http", "json"], optional = true }
flate2 = { version = "1.1.2", optional = true }
kuchikiki = { version = "=0.8.8-speedreader", optional = true }
mime_guess = { version = "2.0.5", optional = true }
reqwest = { version = "0.12.23", default-features = false, features = ["json", "rustls-tls", "stream"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = { version = "0.10.9", optional = true }
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "runtime-tokio-rustls", "json"], optional = true }
tar = { version = "0.4.44", optional = true }
tokio = { version = "1.47.1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "sync", "time"], optional = true }
toml = { version = "0.9.5", optional = true }
tower-http = { version = "0.6.2", features = ["fs", "compression-gzip"], optional = true }
uuid = { version = "1.18.1", features = ["v4", "v5"], optional = true }
wasmtime = { version = "48.0.0", default-features = false, features = ["anyhow", "component-model", "cranelift", "gc-drc", "runtime", "std"], optional = true }
web-sys = { version = "0.3.77", features = ["AbortSignal", "Document", "Element", "Node", "Location", "Window"], optional = true }
aio_plugin_account = { package = "aio-plugin-account", git = "https://github.com/zjarlin/aio-plugin-account.git", rev = "b6e6c561397e60fba1a1a9832ded783b19969506", optional = true }
aio_plugin_dictionary_client = { package = "aio-plugin-dictionary-client", git = "https://github.com/zjarlin/aio-plugin-dictionary.git", rev = "35283ae2b1d78c6dd7ee23c5330106617d701f81", optional = true }
aio_plugin_dictionary_server = { package = "aio-plugin-dictionary-server", git = "https://github.com/zjarlin/aio-plugin-dictionary.git", rev = "35283ae2b1d78c6dd7ee23c5330106617d701f81", optional = true }
aio_plugin_file_client = { package = "aio-plugin-file-client", git = "https://github.com/zjarlin/aio-plugin-file.git", rev = "d7d5056c382c230ecf460996d7ec284cae0f14ac", optional = true }
aio_plugin_file_server = { package = "aio-plugin-file-server", git = "https://github.com/zjarlin/aio-plugin-file.git", rev = "d7d5056c382c230ecf460996d7ec284cae0f14ac", optional = true }
aio_plugin_marketplace_client = { package = "aio-plugin-marketplace-client", git = "https://github.com/zjarlin/aio-plugin-marketplace.git", rev = "5a9abb0ba9ea78b770101d2e0bf31c801fc0273d", optional = true }
aio_plugin_marketplace_server = { package = "aio-plugin-marketplace-server", git = "https://github.com/zjarlin/aio-plugin-marketplace.git", rev = "5a9abb0ba9ea78b770101d2e0bf31c801fc0273d", optional = true }
aio_plugin_settings = { package = "aio-plugin-settings", git = "https://github.com/zjarlin/aio-plugin-settings.git", rev = "128f755229c19cc47202726671a4a1151f6e8081", optional = true }
aio_plugin_identity_client = { package = "aio-plugin-identity-client", git = "https://github.com/zjarlin/aio-plugin-identity.git", rev = "340b5f2f3956100a32ecbbdcee5cccb6dc84c9dd", optional = true }
aio_plugin_identity_server = { package = "aio-plugin-identity-server", git = "https://github.com/zjarlin/aio-plugin-identity.git", rev = "340b5f2f3956100a32ecbbdcee5cccb6dc84c9dd", optional = true }
aio_plugin_rbac_client = { package = "aio-plugin-rbac-client", git = "https://github.com/zjarlin/aio-plugin-rbac.git", rev = "7c954695525197dab0892e8b6e7e646d6e2bb596", optional = true }
aio_plugin_rbac_server = { package = "aio-plugin-rbac-server", git = "https://github.com/zjarlin/aio-plugin-rbac.git", rev = "7c954695525197dab0892e8b6e7e646d6e2bb596", optional = true }
aio_plugin_tenant_client = { package = "aio-plugin-tenant-client", git = "https://github.com/zjarlin/aio-plugin-tenant.git", rev = "03b03a69c75cdf4a4eea3776a8d9a8a4a70ef827", optional = true }
aio_plugin_tenant_server = { package = "aio-plugin-tenant-server", git = "https://github.com/zjarlin/aio-plugin-tenant.git", rev = "03b03a69c75cdf4a4eea3776a8d9a8a4a70ef827", optional = true }

[features]
components = ["dep:az-plugin-bundle", "dep:az-plugin-contract", "dep:az-plugin-runtime", "dep:async-trait", "dep:semver", "dep:getrandom", "dep:futures-util"]
default = ["web"]
ui = ["dep:dioxus", "dep:az-dioxus-admin-shell", "dep:az-ui-components"]
web = ["ui", "dioxus/web", "dioxus/launch", "dep:gloo-net", "dep:web-sys", "dep:aio_plugin_account", "dep:aio_plugin_dictionary_client", "dep:aio_plugin_file_client", "dep:aio_plugin_identity_client", "dep:aio_plugin_marketplace_client", "dep:aio_plugin_rbac_client", "dep:aio_plugin_settings", "dep:aio_plugin_tenant_client"]
desktop = ["ui", "dioxus/desktop", "dioxus/launch", "dep:gloo-net", "dep:web-sys", "dep:aio_plugin_account", "dep:aio_plugin_dictionary_client", "dep:aio_plugin_file_client", "dep:aio_plugin_identity_client", "dep:aio_plugin_marketplace_client", "dep:aio_plugin_rbac_client", "dep:aio_plugin_settings", "dep:aio_plugin_tenant_client"]
server = ["components", "az-plugin-manifest/validation", "dep:az-plugin-package", "dep:axum", "dep:flate2", "dep:kuchikiki", "dep:mime_guess", "dep:reqwest", "dep:sha2", "dep:sqlx", "dep:tar", "dep:tokio", "dep:toml", "dep:tower-http", "dep:uuid", "dep:wasmtime", "dep:aio_plugin_dictionary_server", "dep:aio_plugin_file_server", "dep:aio_plugin_identity_server", "dep:aio_plugin_marketplace_server", "dep:aio_plugin_rbac_server", "dep:aio_plugin_tenant_server"]

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
base64 = "0.22.1"
tempfile = "3.23.0"

[patch."https://github.com/zjarlin/dioxus-admin-workbench.git"]
az-dioxus-admin-shell = { path = "lib/dioxus-admin-workbench/crates/admin-shell/dioxus" }
az-ui-components = { path = "lib/dioxus-admin-workbench/crates/ui/components" }
az-admin-shell-core = { path = "lib/dioxus-admin-workbench/crates/admin-shell/core" }
